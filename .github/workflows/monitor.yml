name: Trump Truth Social Monitor

on:
  push:
    branches: [ main ]
  schedule:
    # Backup cron only — GitHub does NOT guarantee this runs on time
    # (it can queue/delay well past 5 min under load). The real fix for
    # speed is the external dispatch trigger described below.
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [check_posts]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode: ignore sent_posts.txt and grab recent posts instead'
        type: boolean
        default: false
      test_hours:
        description: 'Test mode: how many hours back to look'
        type: string
        default: '5'

concurrency:
  group: trump-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser deep-translator requests beautifulsoup4 playwright

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}

    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: playwright install --with-deps chromium

    - name: Execute Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        TEST_HOURS: ${{ github.event.inputs.test_hours || '5' }}
      run: python bot.py

    - name: Commit and Push Tracked Posts List
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add sent_posts.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update tracked posts list [skip ci]" && git push)
